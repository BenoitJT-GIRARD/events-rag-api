<svg xmlns="http://www.w3.org/2000/svg" width="686" height="438" viewBox="0 0 686 438" role="img" aria-label="Retrieval ablation: recall@1 and MRR@10 for every configuration, with standard error at n = 20">
<style>
  .title { font: 600 15px system-ui, sans-serif; fill: #1B1F23 }
  .label { font: 13px system-ui, sans-serif; fill: #1B1F23 }
