name: Eval

# Manual only, and it must stay that way: every run calls a paid API.
on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      EVENTS_RAG_MISTRAL_API_KEY: ${{ secrets.EVENTS_RAG_MISTRAL_API_KEY }}
      EVENTS_RAG_REBUILD_TOKEN: dummy-token
      # The run writes beside what is published, never over it: reports/ is committed, and a
      # workflow that rewrote it would replace the numbers of the README with numbers nobody
      # read. var/ is the ignored directory, and it is what the artefact below carries.
      EVENTS_RAG_REPORTS_DIR: var/eval-run

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups

      # No ingestion step. The corpus in data/raw/ is committed and frozen on purpose:
      # upstream is a rolling window, so re-ingesting would build a different corpus and
      # silently invalidate every number published in the README.

      - name: Build index
        run: uv run python scripts/build_index.py

      - name: Heuristic evaluation
        run: uv run python scripts/evaluate_rag.py

      - name: Ragas evaluation
        run: uv run python scripts/evaluate_ragas.py

      - name: Retrieval ablation
        run: uv run python scripts/run_ablation.py

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-results
          path: var/eval-run/

      - name: Show what changed against the published results
        if: always()
        run: |
          echo "--- ablation_results.json"
          diff --unified=0 reports/ablation_results.json var/eval-run/ablation_results.json || true
