name: Eval

# Manual only, and it must stay that way: every run calls a paid API.
on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      EVENTS_RAG_MISTRAL_API_KEY: ${{ secrets.EVENTS_RAG_MISTRAL_API_KEY }}
      EVENTS_RAG_REBUILD_TOKEN: dummy-token

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv python install 3.12
      - run: uv sync --all-groups

      # No ingestion step. The corpus in data/raw/ is committed and frozen on purpose:
      # upstream is a rolling window, so re-ingesting would build a different corpus and
      # silently invalidate every number published in the README.

      - name: Build index
        run: uv run python scripts/build_index.py

      - name: Heuristic evaluation
        run: uv run python scripts/evaluate_rag.py

      - name: Ragas evaluation
        run: uv run python scripts/evaluate_ragas.py

      - name: Retrieval ablation
        run: uv run python scripts/run_ablation.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: data/eval/
