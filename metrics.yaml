# What the published numbers mean.
#
# Every numeric column of every table in the README and every axis of the figure is a key
# here. A label alone — `recall@1`, `MRR@10` — leaves the reader to guess what was measured,
# over what, and whether larger is better. The unit lives here rather than inside a variable
# name, so the README, the figure and the code read the same definition.

metrics:

  recall@1:
    definition: >-
      The share of questions whose source event is the FIRST result returned by retrieval.
    unit: "proportion, 0 to 1"
    direction: higher_is_better
    anchor: "0.90 — reports/ablation_results.json#results[dense-baseline].metrics.recall@1"
    business_reading: >-
      Out of twenty people asking, eighteen get the right event at the top of the list and
      read it without scrolling. The other two find it lower down, or not at all.
    source: "scripts/run_ablation.py, over the twenty positive cases of data/questions/reference_qa.json"
    uncertainty: >-
      Binomial standard error at n = 20: about 6.7 points at p = 0.9, so a 95 % interval of
      roughly ±13 points. That interval is the conservative reading. Two configurations answer
      the same questions, so the comparison is paired, and reports/paired_comparison.json
      carries McNemar's exact test on the discordant pairs, which is what decides whether a
      gap is a gap.

  recall@5:
    definition: >-
      The share of questions whose source event appears anywhere in the first five results.
    unit: "proportion, 0 to 1"
    direction: higher_is_better
    anchor: "1.00 — reports/ablation_results.json#results[dense-baseline].metrics.recall@5"
    business_reading: >-
      Whether the answer is reachable at all. Five results is what the generation step is
      given, so an event missing from this window cannot appear in the answer, however good
      the model is.
    source: "scripts/run_ablation.py, over the twenty positive cases of data/questions/reference_qa.json"
    uncertainty: >-
      Same binomial error. At 1.00 the interval is one-sided and the honest statement is
      'no failure observed in twenty', not 'never fails'.

  MRR@10:
    definition: >-
      Mean reciprocal rank: the average of 1/rank of the source event over the first ten
      results, counting zero when it is absent.
    unit: "score, 0 to 1"
    direction: higher_is_better
    anchor: "0.950 — reports/ablation_results.json#results[dense-baseline].metrics.mrr@10"
    business_reading: >-
      How high the right event sits, not merely whether it is there. It separates two
      configurations that both find the event but rank it second rather than first.
    source: "scripts/run_ablation.py, over the twenty positive cases of data/questions/reference_qa.json"
    uncertainty: >-
      Not a proportion, so no binomial interval is quoted. At n = 20 a single rank change
      moves it by up to 0.025, which is the resolution to read it at.

  median_latency:
    definition: >-
      Median wall-clock time of the retrieval step alone, model call excluded, over the
      twenty questions.
    unit: "milliseconds"
    direction: lower_is_better
    anchor: "192.7 — reports/ablation_results.json#results[dense-baseline].median_latency_ms"
    business_reading: >-
      The part of the wait this repository controls. The answer a user waits for is about
      2.5 s end to end; almost all of the rest is the generation call.
    source: "scripts/run_ablation.py, measured on the machine that ran the ablation"
    uncertainty: >-
      Median of twenty measurements on one machine, with no repetition: comparable between
      rows of the same run, and not comparable to a number produced on other hardware.

  lexical_overlap:
    definition: >-
      The share of a question's content words — four characters or more, accents folded —
      that appear verbatim in the event it was written from.
    unit: "proportion, 0 to 1"
    direction: target
    anchor: "0.5 — reports/difficulty.json#mean_lexical_overlap"
    business_reading: >-
      How much the benchmark can be solved by string matching instead of understanding. It
      is the number that exposed the first question set, where it stood at 0.61 and BM25
      alone scored 0.90.
    source: "scripts/measure_difficulty.py, over the twenty positive cases"
    uncertainty: >-
      Mean over twenty questions, no interval quoted: it is a property of the question set,
      not an estimate of a population. Town names are its irreducible floor.

  questions_won:
    definition: >-
      In a paired comparison against the shipped configuration, the number of questions this
      configuration retrieves at the given depth and the shipped one does not.
    unit: "questions, out of the twenty that carry a target event"
    direction: higher_is_better
    anchor: "1 — reports/paired_comparison.json#comparisons[dense+city-filter, recall@1].won"
    business_reading: >-
      The concrete size of a gain: one question out of twenty means one person in twenty
      finds their event at the top who would not have otherwise.
    source: "scripts/compare_paired.py, from the per-question ranks of scripts/run_ablation.py"
    uncertainty: >-
      A count, not an estimate. What is uncertain is whether it would hold on other
      questions, and that is what the p value beside it answers.

  questions_lost:
    definition: >-
      The mirror of the above: questions the shipped configuration retrieves at the given
      depth and this one does not.
    unit: "questions, out of the twenty that carry a target event"
    direction: lower_is_better
    anchor: "8 — reports/paired_comparison.json#comparisons[bm25-only, recall@1].lost"
    business_reading: >-
      What switching would cost. Eight lost questions out of twenty is the price of dropping
      embeddings for lexical search alone.
    source: "scripts/compare_paired.py, from the per-question ranks of scripts/run_ablation.py"
    uncertainty: >-
      A count, not an estimate; the p value beside it says whether the imbalance between won
      and lost is more than a coin toss.

  mcnemar_p:
    definition: >-
      Two-sided p value of McNemar's exact test on the discordant questions: the probability
      of an imbalance at least this large if the two configurations were equally good.
    unit: "probability, 0 to 1"
    direction: lower_is_better
    anchor: "0.008 — reports/paired_comparison.json#comparisons[bm25-only, recall@1].p_value"
    business_reading: >-
      Whether a difference is worth acting on. Below 0.05 the gap survives the sample size;
      above it, the two configurations are indistinguishable on twenty questions, however
      different their averages look.
    source: "scripts/compare_paired.py, events_rag.evaluation.retrieval.mcnemar_exact"
    uncertainty: >-
      Exact rather than asymptotic: at twenty questions the discordant pairs are few enough
      that the normal approximation is wrong, so the binomial tail is summed directly.
