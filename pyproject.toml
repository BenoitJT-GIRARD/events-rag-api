[project]
name = "events-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over a frozen corpus of public events."
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "langchain-community>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-mistralai>=0.2.0",
  "faiss-cpu>=1.8.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "langchain-text-splitters>=1.1.1",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
rerank = [
    "flashrank>=0.2.10",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  "pre-commit>=4.0.0",
]
test = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ragas>=0.4.3,<0.5",
]
lint = [
  "ruff>=0.6.0",
  "bandit[toml]>=1.7.10",
]
# Outside the default groups: this one is for taking the screenshots, once, on the
# author's machine. The browser is the system's own (channel="chrome"), so nothing is
# downloaded. Run `uv sync --group capture` before `python scripts/capture.py`.
capture = [
  "playwright>=1.47.0",
]
# Outside the default groups, like the one above: reading the notebooks needs nothing,
# replaying them needs a kernel. `uv sync --group notebook` before
# `python scripts/run_notebooks.py`.
notebook = [
  "ipykernel>=6.29.0",
  "matplotlib>=3.9.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "N", "W"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """-ra -q --strict-markers --strict-config --import-mode=importlib   --cov --cov-branch --cov-report=term-missing --cov-report=xml"""
testpaths = ["tests"]
markers = [
    "integration: two real components wired together, or one against a real dependency",
    "system: the product run the way the README says to run it, in its own process",
    "claim: fails when a published number, figure or table stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors. The suite passes with no exemption: nothing this code or
# its dependencies emit needs silencing, and now a new deprecation will say so.
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "data"]
skips = ["B101"]

[tool.coverage.run]
# Without this, the published XML report writes the absolute root of the measured sources:
# a reader finds the directory tree of the machine that ran the suite, and two runs on two
# machines produce two different files for the same numbers.
relative_files = true
branch = true
source = ["src/events_rag", "scripts"]
data_file = "var/.coverage"
# Four modules this project uses without owning: the figure style, the capture script, the
# smoke runner and the notebook runner. They are copied in rather than imported, so that a
# clone needs nothing beyond matplotlib, and they are tested at their source. Measuring
# them here would report someone else's coverage as this project's.
omit = [
  "*/figure_style.py",
  "scripts/capture.py",
  "scripts/run_notebooks.py",
  "scripts/smoke.py",
]

[tool.coverage.report]
# The floor is the rate measured the day the three tiers were completed, rounded down. A
# floor below the current rate lets the next commit lose coverage in silence.
#
# 65, not 80: `scripts/` is thin entry points exercised by the system tier in a separate
# process, which coverage does not see, and the generation-side modules call a paid model
# that the suite refuses to call. What is measurable is measured, and this floor is that
# measurement rounded down.
fail_under = 65
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
directory = "var/coverage-html"
