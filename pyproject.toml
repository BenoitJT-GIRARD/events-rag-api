[project]
name = "events-rag"
version = "0.1.0"
description = "POC RAG pour la recommandation d'événements OpenAgenda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-mistralai>=0.2.0",
  "faiss-cpu>=1.8.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "langchain-text-splitters>=1.1.1",
  "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  "pre-commit>=4.0.0",
]
test = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "datasets>=4.7.0",
  "ragas>=0.4.3",
]
lint = [
  "ruff>=0.6.0",
  "bandit[toml]>=1.7.10",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "N", "W"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "data"]
skips = ["B101"]

[tool.coverage.run]
source = ["src/events_rag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
